<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroGon — Your Intelligent Crop Guardian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#1B7F4C;
  --secondary:#2E9D68;
  --accent:#F4B942;
  --bg:#F7FAF7;
  --dark:#12352A;
  --danger:#D9534F;
  --warning:#E8A317;
  --success:#2E9D68;
  --ink:#16241D;
  --mist:#E4ECE6;
  --mist-2:#EFF5F0;
  --white:#FFFFFF;
  --shadow: 0 8px 24px rgba(18,53,42,0.08);
  --shadow-sm: 0 2px 8px rgba(18,53,42,0.06);
  --radius: 20px;
  --radius-sm: 12px;
  --font-head:'Manrope',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 10%, rgba(46,157,104,0.10), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(27,127,76,0.10), transparent 45%),
    var(--dark);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 12px;
  position:relative;
  overflow-x:hidden;
}
/* ambient contour-line texture, like a topographic field survey */
body::before{
  content:"";
  position:fixed; inset:0;
  background-image: repeating-radial-gradient(circle at 20% 30%, transparent 0, transparent 38px, rgba(244,249,246,0.035) 39px, transparent 40px),
                     repeating-radial-gradient(circle at 80% 75%, transparent 0, transparent 54px, rgba(244,249,246,0.03) 55px, transparent 56px);
  pointer-events:none;
  z-index:0;
}
.stage{
  position:relative; z-index:1;
  display:flex; flex-direction:column; align-items:center; gap:14px;
}
.brandmark{
  display:flex; align-items:center; gap:10px; color:#EAF3EC; opacity:0.85;
  font-family:var(--font-head); font-weight:800; letter-spacing:0.4px; font-size:14px;
}
.brandmark svg{width:22px;height:22px;}

/* ===== Phone frame ===== */
.phone{
  width:392px; height:824px;
  background:var(--dark);
  border-radius:46px;
  padding:14px;
  box-shadow: 0 40px 80px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.04) inset;
  position:relative;
}
.phone::after{ /* notch */
  content:"";
  position:absolute; top:14px; left:50%; transform:translateX(-50%);
  width:120px; height:26px; background:var(--dark); border-radius:0 0 18px 18px; z-index:5;
}
.screen{
  width:100%; height:100%;
  background:var(--bg);
  border-radius:32px;
  overflow:hidden;
  position:relative;
  display:flex; flex-direction:column;
}
.statusbar{
  height:34px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:0 26px; font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--dark); background:transparent; z-index:4;
}
.view-port{
  flex:1 1 auto; overflow-y:auto; overflow-x:hidden; position:relative; scrollbar-width:none;
}
.view-port::-webkit-scrollbar{display:none;}
.view{
  position:absolute; inset:0; padding-bottom:20px;
  animation: viewIn 340ms cubic-bezier(.22,.9,.32,1);
}
@keyframes viewIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

/* ===== Bottom Nav ===== */
.bottomnav{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-around;
  padding:10px 6px 16px; background:var(--white); border-top:1px solid var(--mist); position:relative; z-index:6;
}
.navbtn{ display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:#8AA093; font-family:var(--font-body); font-size:10.5px; font-weight:600; cursor:pointer; padding:4px 8px;}
.navbtn.active{color:var(--primary);}
.navbtn svg{width:22px;height:22px;}
.navbtn.scanbtn{
  margin-top:-30px; background:linear-gradient(155deg,var(--secondary),var(--primary)); color:#fff;
  width:56px; height:56px; border-radius:50%; justify-content:center; box-shadow:0 10px 22px rgba(27,127,76,0.4);
}
.navbtn.scanbtn svg{width:24px;height:24px;}
.navbtn.scanbtn span{display:none;}

/* ===== Typography ===== */
h1,h2,h3{font-family:var(--font-head); color:var(--dark); margin:0;}
.h1{font-size:26px; font-weight:800; letter-spacing:-0.3px;}
.h2{font-size:19px; font-weight:800;}
.h3{font-size:15px; font-weight:700;}
.eyebrow{font-family:var(--font-mono); font-size:10.5px; letter-spacing:1.4px; text-transform:uppercase; color:var(--secondary); font-weight:600;}
.muted{color:#5E7568; font-size:13px; line-height:1.5;}
.mono{font-family:var(--font-mono);}

/* ===== Common layout ===== */
.px{padding-left:20px; padding-right:20px;}
.section{padding:18px 20px 4px;}
.row{display:flex; align-items:center; justify-content:space-between;}
.stack{display:flex; flex-direction:column; gap:12px;}
.hgap8{display:flex; gap:8px;}
.hgap10{display:flex; gap:10px;}

/* ===== Cards ===== */
.card{
  background:var(--white); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow-sm); border:1px solid var(--mist);
}
.card.tight{padding:12px 14px;}
.pill{
  display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:5px 10px; border-radius:100px;
  font-family:var(--font-body);
}
.pill.low{background:#E7F5EC; color:var(--primary);}
.pill.medium{background:#FDF3DB; color:#9A6B0A;}
.pill.high{background:#FBE8E7; color:var(--danger);}
.pill.neutral{background:var(--mist-2); color:#5E7568;}

/* ===== Buttons ===== */
.btn{
  font-family:var(--font-head); font-weight:700; font-size:14.5px; border:none; border-radius:14px; padding:15px 18px;
  display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; width:100%; transition:transform .15s ease;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:linear-gradient(155deg,var(--secondary),var(--primary)); color:#fff; box-shadow:0 10px 20px rgba(27,127,76,0.28);}
.btn-secondary{background:var(--white); color:var(--primary); border:1.5px solid var(--primary);}
.btn-ghost{background:transparent; color:#5E7568; box-shadow:none;}
.btn-accent{background:var(--accent); color:var(--dark);}
.btn-sm{padding:10px 14px; font-size:13px; border-radius:11px; width:auto;}

/* ===== Inputs ===== */
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-size:12.5px; font-weight:600; color:var(--dark);}
.field input, .field select{
  border:1.5px solid var(--mist); background:var(--mist-2); border-radius:12px; padding:13px 14px; font-size:14.5px; font-family:var(--font-body); color:var(--ink); outline:none;
}
.field input:focus, .field select:focus{border-color:var(--secondary); background:#fff;}

/* ===== Leaf-ring health gauge (signature element) ===== */
.gauge-wrap{position:relative; display:flex; align-items:center; justify-content:center;}
.gauge-wrap svg{transform:rotate(-90deg);}
.gauge-track{stroke:var(--mist); fill:none;}
.gauge-fill{fill:none; stroke-linecap:round; transition:stroke-dashoffset 1.1s cubic-bezier(.22,.9,.32,1);}
.gauge-center{position:absolute; text-align:center;}
.gauge-num{font-family:var(--font-head); font-weight:800; color:var(--dark);}
.gauge-label{font-size:10.5px; color:#5E7568; font-weight:600;}

/* ===== Splash ===== */
.splash{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; background:
  radial-gradient(ellipse at 50% 0%, #1E9259 0%, var(--dark) 65%); color:#fff; gap:16px; text-align:center;}
.splash .logo{width:78px;height:78px; animation:leafPulse 2.2s ease-in-out infinite;}
@keyframes leafPulse{0%,100%{transform:scale(1); filter:drop-shadow(0 0 0 rgba(244,185,66,0));} 50%{transform:scale(1.06); filter:drop-shadow(0 0 18px rgba(244,185,66,0.35));}}
.splash .word{font-family:var(--font-head); font-weight:800; font-size:30px; letter-spacing:1px;}
.splash .tag{font-size:13px; color:#BFE0CC; max-width:230px; line-height:1.5;}
.splash .barwrap{width:120px; height:3px; background:rgba(255,255,255,0.15); border-radius:10px; overflow:hidden; margin-top:10px;}
.splash .bar{height:100%; width:0%; background:var(--accent); animation:load 2s ease forwards;}
@keyframes load{to{width:100%;}}

/* ===== Onboarding ===== */
.onb{height:100%; display:flex; flex-direction:column;}
.onb-art{flex:1; display:flex; align-items:center; justify-content:center; background:var(--mist-2); position:relative; overflow:hidden;}
.onb-dots{display:flex; gap:6px; justify-content:center; margin:14px 0;}
.dot{width:6px;height:6px;border-radius:50%; background:var(--mist);}
.dot.on{width:20px; background:var(--primary);}
.onb-body{padding:0 26px 22px; text-align:center;}
.skip{position:absolute; top:18px; right:20px; z-index:3; color:#5E7568; font-size:13px; font-weight:600; background:none; border:none;}

/* misc */
.badge-dot{width:8px;height:8px;border-radius:50%; display:inline-block;}
.divider{height:1px; background:var(--mist); margin:14px 0;}
.chip{background:var(--mist-2); border:1px solid var(--mist); border-radius:100px; padding:8px 13px; font-size:12.5px; font-weight:600; color:var(--dark); white-space:nowrap;}
.scroll-x{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;}
.scroll-x::-webkit-scrollbar{display:none;}

/* field map */
.fieldmap{
  position:relative; border-radius:16px; overflow:hidden; height:150px;
  background:
    linear-gradient(160deg, rgba(27,127,76,0.10), transparent),
    repeating-linear-gradient(0deg, #DCEBE1 0 2px, transparent 2px 18px),
    repeating-linear-gradient(90deg, #DCEBE1 0 2px, transparent 2px 18px),
    #EAF3EC;
  border:1px solid var(--mist);
}
.zone{position:absolute; border-radius:8px; opacity:0.85; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:10px; font-weight:700; color:#fff; cursor:pointer; transition:transform .15s;}
.zone:active{transform:scale(0.95);}

/* Scanner */
.scanview{height:340px; background:linear-gradient(180deg,#0F2A20,#12352A); position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden;}
.scanview img{width:100%; height:100%; object-fit:cover; opacity:0.9;}
.scan-frame{position:absolute; inset:34px; border:2px solid rgba(244,185,66,0.8); border-radius:18px;}
.scan-corner{position:absolute; width:22px; height:22px; border-color:var(--accent); }
.scanline{position:absolute; left:34px; right:34px; height:2px; background:linear-gradient(90deg,transparent,var(--accent),transparent); box-shadow:0 0 12px 2px rgba(244,185,66,0.6); animation:scanmove 1.8s ease-in-out infinite;}
@keyframes scanmove{0%{top:40px;} 50%{top:300px;} 100%{top:40px;}}

/* chat */
.msg{max-width:78%; padding:11px 14px; border-radius:16px; font-size:13.5px; line-height:1.45;}
.msg.bot{background:var(--white); border:1px solid var(--mist); border-bottom-left-radius:4px; align-self:flex-start;}
.msg.user{background:var(--primary); color:#fff; border-bottom-right-radius:4px; align-self:flex-end;}

/* toast */
.toast{position:absolute; left:16px; right:16px; bottom:88px; background:var(--dark); color:#fff; padding:12px 16px; border-radius:14px; font-size:13px; display:flex; align-items:center; gap:10px; box-shadow:0 12px 24px rgba(0,0,0,0.3); z-index:50; animation:toastIn .3s ease;}
@keyframes toastIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

/* drone */
.dronepath{position:absolute; inset:0;}
.dronedot{position:absolute; width:22px; height:22px; transition:left 1.1s linear, top 1.1s linear;}
.stepper{display:flex; flex-direction:column; gap:0;}
.stepitem{display:flex; gap:12px;}
.stepline{width:22px; display:flex; flex-direction:column; align-items:center;}
.stepcircle{width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; flex:0 0 auto; font-weight:800;}
.stepbar{width:2px; flex:1; min-height:22px;}

/* demo mode ribbon */
.demoribbon{
  position:absolute; top:14px; right:-34px; background:var(--accent); color:var(--dark); font-family:var(--font-mono); font-weight:700;
  font-size:10px; padding:4px 40px; transform:rotate(45deg); z-index:40; letter-spacing:1px; box-shadow:0 2px 6px rgba(0,0,0,0.15);
  pointer-events:none;
}

/* top app header */
.topbar{padding:16px 20px 8px; display:flex; align-items:center; gap:12px;}
.iconbtn{width:38px;height:38px; border-radius:12px; background:var(--white); border:1px solid var(--mist); display:flex; align-items:center; justify-content:center; cursor:pointer;}
.iconbtn svg{width:18px;height:18px;}

.side-scale{transform-origin:top left;}
@media (max-width:440px){
  .phone{width:100vw; height:100vh; border-radius:0; padding:0;}
  .phone::after{display:none;}
  .screen{border-radius:0;}
  .stage{gap:0;}
  .brandmark{display:none;}
}
</style>
</head>

/* ---------- GAUGE COMPONENT ---------- */
function gauge(pct, size=120, stroke=12, color, label){
  const r = (size-stroke)/2;
  const c = 2*Math.PI*r;
  const off = c - (pct/100)*c;
  const col = color || (pct>=70?"#2E9D68":pct>=40?"#E8A317":"#D9534F");
  return `
  <div class="gauge-wrap" style="width:${size}px;height:${size}px;">
    <svg width="${size}" height="${size}">
      <circle class="gauge-track" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"/>
      <circle class="gauge-fill" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}"
        stroke="${col}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    </svg>
    <div class="gauge-center">
      <div class="gauge-num" style="font-size:${size*0.26}px;">${pct}%</div>
      ${label? `<div class="gauge-label">${label}</div>`:""}
    </div>
  </div>`;
}

}

const MISSION_STEPS = [
  {t:"Mission Planning", d:"Route generated across Zone D (0.35 acres)."},

function viewMissionSim(){
  const stage = state.missionStage;
  const dronePos = [
    {top:"85%",left:"10%"},{top:"85%",left:"10%"},{top:"70%",left:"20%"},
    {top:"50%",left:"45%"},{top:"30%",left:"68%"},{top:"30%",left:"68%"},{top:"30%",left:"68%"},
  ][stage];
  return `${topbar("Mission #AG-1024",{back:"drone"})}
  <div class="section">
    <div class="fieldmap" style="height:190px;">
      ${DEMO.zones.map(z=>`<div class="zone" style="top:${z.top};left:${z.left};width:${z.w};height:${z.h};background:${z.color};opacity:${z.id==='D'?0.9:0.25}">${z.id}</div>`).join("")}
      <div class="dronedot" style="top:${dronePos.top};left:${dronePos.left};">
        <svg viewBox="0 0 24 24" fill="none" stroke="#12352A" stroke-width="2"><circle cx="12" cy="12" r="2.4" fill="#F4B942"/><path d="M12 9.6V6M12 14.4V18M9.6 12H6M14.4 12H18"/><circle cx="5" cy="5" r="2.2"/><circle cx="19" cy="5" r="2.2"/><circle cx="5" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/></svg>
      </div>
    </div>
  </div>
  <div class="section">
    <div class="card stepper">
      ${MISSION_STEPS.map((s,i)=>`
        <div class="stepitem">
          <div class="stepline">
            <div class="stepcircle" style="background:${i<stage?'#2E9D68':i===stage?'#F4B942':'var(--mist)'};color:${i<=stage?'#fff':'#8AA093'};">${i<stage?'✓':i+1}</div>
            ${i<MISSION_STEPS.length-1?`<div class="stepbar" style="background:${i<stage?'#2E9D68':'var(--mist)'}"></div>`:""}
          </div>
          <div style="padding-bottom:16px;">
            <b style="font-size:13.5px;color:${i<=stage?'var(--dark)':'#8AA093'}">${s.t}</b>
            ${i===stage?`<div class="muted" style="margin-top:2px;">${s.d}</div>`:""}
          </div>
        </div>`).join("")}
    </div>
  </div>
  <div class="section">
    ${stage===1?`<button class="btn btn-primary" onclick="approveMission()">Approve & Launch Mission</button>`
      : stage<MISSION_STEPS.length-1 ? `<button class="btn btn-secondary" onclick="advanceMission()">Simulate Next Step →</button>`
      : `<button class="btn btn-primary" onclick="go('dashboard')">View Updated Crop Health</button>`}
  </div>`;
}
function advanceMission(){ if(state.missionStage<MISSION_STEPS.length-1){ state.missionStage++; go('missionSim'); if(state.missionStage===1) setTimeout(()=>{},0);} }
function approveMission(){ state.missionStage=2; go('missionSim'); showToast("Mission approved — drone launching"); autoRun(); }
function autoRun(){
  const timer = setInterval(()=>{
    if(state.view!=="missionSim"){ clearInterval(timer); return; }
    if(state.missionStage<MISSION_STEPS.length-1){ state.missionStage++; render(); }
    else clearInterval(timer);
  }, 1300);
}

/* ---------- ROUTER TABLE ---------- */
const VIEWS = {
  splash: viewSplash, onboarding: viewOnboarding, login: viewLogin, register: viewRegister,
  registerDone: viewRegisterDone, otp: viewOtp, dashboard: viewDashboard, farm: viewFarm,
  landmap: viewLandmap, scanner: viewScanner, risk: viewRisk, alerts: viewAlerts,
  advisory: viewAdvisory, sensors: viewSensors, treatment: viewTreatment, zoneDetail: viewZoneDetail,
  drone: viewDroneHome, missionSim: viewMissionSim, history: viewHistory, notifications: viewNotifications,
  profile: viewProfile,
};
const NAV_VIEWS = new Set(["dashboard","farm","alerts","profile","sensors","risk"]);
const NO_STATUSBAR_PAD = new Set(["splash"]);

function render(){
  const vp = document.getElementById("viewport");
  const fn = VIEWS[state.view] || viewDashboard;
  vp.innerHTML = `<div class="view">${fn()}</div>`;
  // reset scan stage when leaving scanner
  if(state.view!=="scanner") state.scanStage="capture";

  document.getElementById("demoribbon").style.display = state.demoMode && state.view!=="splash" && state.view!=="onboarding" ? "block":"none";

  const bn = document.getElementById("bottomnav");
  if(NAV_VIEWS.has(state.view) || state.view==="scanner"){
    bn.style.display="flex";
    bn.innerHTML = NAV.map(n=>{
      if(n.scan) return `<button class="navbtn scanbtn" onclick="state.scanStage='capture'; go('scanner')">${icon(n.icon,"")}<span>${n.label}</span></button>`;
      const active = state.view===n.id;
      return `<button class="navbtn ${active?'active':''}" onclick="go('${n.id}')">${icon(n.icon,"")}<span>${n.label}</span></button>`;
    }).join("");
  } else {
    bn.style.display="none";
  }
}

/* clock */
function tickClock(){
  const d = new Date();
  let h = d.getHours()%12; if(h===0)h=12;
  const m = d.getMinutes().toString().padStart(2,"0");
  document.getElementById("clock").textContent = `${h}:${m}`;
}
tickClock(); setInterval(tickClock, 30000);

/* boot sequence */
render();
setTimeout(()=>{ if(state.view==="splash") go("onboarding"); }, 2200);
</script>
